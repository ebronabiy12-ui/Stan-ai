seed: 42
batch_size: 8
grad_accum_steps: 4
seq_len: 512
max_steps: 2000
learning_rate: 5.0e-5
min_learning_rate: 5.0e-6
warmup_steps: 100
weight_decay: 0.05
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
mixed_precision: true
eval_interval: 100
eval_steps: 25
save_interval: 250
log_interval: 25
sft_data_path: STAN-AI/data/processed/sft_instructions.jsonl
tokenizer_path: STAN-AI/checkpoints/tokenizer.model
pretrained_checkpoint: STAN-AI/checkpoints/latest.pt
checkpoint_dir: STAN-AI/checkpoints
val_ratio: 0.1
training_status_on_complete: instruction-tuned
