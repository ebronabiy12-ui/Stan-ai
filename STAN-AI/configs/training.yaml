seed: 42
batch_size: 16
grad_accum_steps: 4
seq_len: 512
max_steps: 50000
learning_rate: 3.0e-4
min_learning_rate: 3.0e-5
warmup_steps: 1000
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
mixed_precision: true
eval_interval: 500
eval_steps: 50
save_interval: 1000
log_interval: 50
train_data_path: STAN-AI/data/processed/train.bin
val_data_path: STAN-AI/data/processed/val.bin
tokenizer_path: STAN-AI/checkpoints/tokenizer.model
checkpoint_dir: STAN-AI/checkpoints
training_status_on_complete: trained
